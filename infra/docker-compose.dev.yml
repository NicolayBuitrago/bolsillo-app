name: bolsillo-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolsillo
      POSTGRES_PASSWORD: bolsillo
      POSTGRES_DB: bolsillo
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsillo -d bolsillo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
